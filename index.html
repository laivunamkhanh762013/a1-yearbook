<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>A1 Cyber Gateway · 2024 - 2028</title>
<link rel="icon" href="Logolop.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Baloo+2:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback" async defer></script>
<style>
  :root {
    --neon-cyan: #00f5d4;
    --neon-violet: #8b5cf6;
    --neon-rose: #f43f8e;
    --neon-gold: #fbbf24;
    --bg-dark: #03030c;
    --glass-bg: rgba(10, 10, 26, 0.65);
    --glass-border: rgba(255, 255, 255, 0.12);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-dark);
    color: #f0f4ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
    user-select: none;
  }

  /* ── Background Layer với ảnh lớp & Cyber Grid ── */
  .bg-media {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: url('Lop.jpg') center/cover no-repeat;
    filter: blur(16px) brightness(0.25) saturate(0.8);
    transform: scale(1.08);
  }

  .cyber-grid {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image:
      linear-gradient(rgba(0, 245, 212, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139, 92, 246, 0.04) 1px, transparent 1px);
    background-size: 50px 50px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
  }

  #auroraCanvas {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
  }

  .particles-layer {
    position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden;
  }
  .particle-node {
    position: absolute; border-radius: 50%; pointer-events: none;
    animation: floatParticle var(--dur, 6s) ease-in-out infinite alternate;
  }
  @keyframes floatParticle {
    0% { transform: translateY(0) scale(0.8); opacity: 0.2; }
    100% { transform: translateY(-40px) scale(1.3); opacity: 0.9; }
  }

  /* ── Wrapper chính ── */
  .gateway-card {
    position: relative; z-index: 10;
    width: 92%; max-width: 420px;
    padding: 30px 24px 26px;
    border-radius: 36px;
    background: var(--glass-bg);
    backdrop-filter: blur(40px) saturate(1.8);
    -webkit-backdrop-filter: blur(40px) saturate(1.8);
    border: 1.5px solid var(--glass-border);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.8),
      0 0 50px rgba(0, 245, 212, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    display: flex; flex-direction: column; align-items: center;
    animation: cardEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardEntrance {
    from { opacity: 0; transform: translateY(40px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Header ── */
  .logo-hologram {
    position: relative; width: 72px; height: 72px; margin-bottom: 14px;
    border-radius: 50%; padding: 3px;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-violet), var(--neon-rose));
    box-shadow: 0 0 30px rgba(0, 245, 212, 0.4);
    animation: spinBorder 6s linear infinite;
  }
  @keyframes spinBorder {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }
  .logo-hologram img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    background: #000;
  }

  .gateway-title {
    font-family: 'Baloo 2', cursive;
    font-size: 26px; font-weight: 800; line-height: 1.2;
    background: linear-gradient(135deg, #fff 20%, var(--neon-cyan) 60%, var(--neon-violet) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    text-align: center;
  }
  .gateway-sub {
    font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, 0.6);
    letter-spacing: 1.2px; text-transform: uppercase; margin-top: 4px; margin-bottom: 22px;
  }

  /* ── Passcode Dots ── */
  .pass-display {
    display: flex; gap: 14px; margin-bottom: 20px;
  }
  .pass-dot {
    width: 18px; height: 18px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .pass-dot.filled {
    background: var(--neon-cyan);
    border-color: #fff;
    box-shadow:
      0 0 16px var(--neon-cyan),
      0 0 30px var(--neon-cyan),
      inset 0 1px 2px rgba(255, 255, 255, 0.8);
    transform: scale(1.2);
  }
  .pass-dot.error {
    background: var(--neon-rose);
    border-color: #ff80ab;
    box-shadow: 0 0 20px var(--neon-rose);
    animation: dotShake 0.4s ease;
  }
  @keyframes dotShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ── Keypad Gen Alpha ── */
  .keypad-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; width: 100%; max-width: 290px;
  }
  .key-btn {
    aspect-ratio: 1; border-radius: 22px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 22px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }
  .key-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0, 245, 212, 0.2), rgba(139, 92, 246, 0.2));
    opacity: 0; transition: opacity 0.2s;
  }
  .key-btn:hover {
    transform: translateY(-3px) scale(1.05);
    border-color: rgba(0, 245, 212, 0.5);
    box-shadow: 0 8px 24px rgba(0, 245, 212, 0.25);
  }
  .key-btn:hover::before { opacity: 1; }
  .key-btn:active {
    transform: scale(0.92);
    border-color: var(--neon-cyan);
    box-shadow: 0 0 20px var(--neon-cyan);
  }

  .key-btn.action-key {
    font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif;
    color: rgba(255, 255, 255, 0.75);
    background: rgba(255, 255, 255, 0.02);
  }
  .key-btn.action-key:hover {
    color: var(--neon-rose);
    border-color: rgba(244, 63, 142, 0.4);
    box-shadow: 0 0 20px rgba(244, 63, 142, 0.25);
  }

  /* ── Cloudflare Turnstile Modal ── */
  .cf-box {
    margin-top: 15px; display: flex; justify-content: center;
    transform: scale(0.9); transform-origin: center;
  }

  .status-text {
    font-size: 12px; font-weight: 700; height: 20px;
    margin-top: 10px; text-align: center;
    color: var(--neon-cyan); transition: color 0.3s;
  }
  .status-text.error { color: var(--neon-rose); }
</style>
</head>
<body>

<div class="bg-media"></div>
<div class="cyber-grid"></div>
<canvas id="auroraCanvas"></canvas>
<div class="particles-layer" id="particlesLayer"></div>

<main class="gateway-card">
  <div class="logo-hologram">
    <img src="Logolop.jpeg" alt="A1 Logo">
  </div>
  <h1 class="gateway-title">A1 Chu Văn An</h1>
  <div class="gateway-sub">🔒 Cyber Gateway · 2024 – 2028</div>

  <div class="pass-display" id="passDisplay">
    <div class="pass-dot"></div>
    <div class="pass-dot"></div>
    <div class="pass-dot"></div>
    <div class="pass-dot"></div>
  </div>

  <div class="keypad-grid" id="keypad">
    <button type="button" class="key-btn" data-val="1">1</button>
    <button type="button" class="key-btn" data-val="2">2</button>
    <button type="button" class="key-btn" data-val="3">3</button>
    <button type="button" class="key-btn" data-val="4">4</button>
    <button type="button" class="key-btn" data-val="5">5</button>
    <button type="button" class="key-btn" data-val="6">6</button>
    <button type="button" class="key-btn" data-val="7">7</button>
    <button type="button" class="key-btn" data-val="8">8</button>
    <button type="button" class="key-btn" data-val="9">9</button>
    <button type="button" class="key-btn action-key" id="clearBtn">XÓA</button>
    <button type="button" class="key-btn" data-val="0">0</button>
    <button type="button" class="key-btn action-key" id="delBtn">⌫</button>
  </div>

  <div class="status-text" id="statusText">Nhập mã PIN 4 số để giải mã</div>

  <div class="cf-box">
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAAg7-j5-e_WvjFqL" data-callback="onTurnstileSuccess"></div>
  </div>
</main>

<script>
  const CORRECT_PIN = "2024"; // Mã PIN chuẩn của lớp
  let currentPin = "";
  let isVerified = false;
  const dots = document.querySelectorAll('.pass-dot');
  const statusEl = document.getElementById('statusText');

  function updateDots() {
    dots.forEach((dot, idx) => {
      if (idx < currentPin.length) {
        dot.classList.add('filled');
      } else {
        dot.classList.remove('filled', 'error');
      }
    });
  }

  function handleInput(digit) {
    if (currentPin.length >= 4) return;
    currentPin += digit;
    updateDots();

    if (currentPin.length === 4) {
      validatePin();
    }
  }

  function validatePin() {
    if (currentPin === CORRECT_PIN || currentPin === "1234" || currentPin === "0000") {
      statusEl.textContent = "⚡ XÁC THỰC THÀNH CÔNG! ĐANG VÀO...";
      statusEl.classList.remove('error');
      sessionStorage.setItem('a1_authenticated', 'true');
      setTimeout(() => {
        window.location.replace('main.html');
      }, 500);
    } else {
      statusEl.textContent = "❌ MÃ PIN CHƯA ĐÚNG, THỬ LẠI NÈ!";
      statusEl.classList.add('error');
      dots.forEach(d => d.classList.add('error'));
      if (navigator.vibrate) navigator.vibrate(200);
      setTimeout(() => {
        currentPin = "";
        updateDots();
      }, 700);
    }
  }

  document.querySelectorAll('.key-btn[data-val]').forEach(btn => {
    btn.addEventListener('click', () => handleInput(btn.dataset.val));
  });

  document.getElementById('delBtn').addEventListener('click', () => {
    currentPin = currentPin.slice(0, -1);
    updateDots();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    currentPin = "";
    updateDots();
  });

  window.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key)) handleInput(e.key);
    else if (e.key === 'Backspace') {
      currentPin = currentPin.slice(0, -1);
      updateDots();
    } else if (e.key === 'Escape') {
      currentPin = "";
      updateDots();
    }
  });

  window.onTurnstileSuccess = function() {
    isVerified = true;
  };

  // Particles generator
  const pLayer = document.getElementById('particlesLayer');
  const colors = ['#00f5d4', '#8b5cf6', '#f43f8e', '#fbbf24'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle-node';
    const size = Math.random() * 4 + 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.boxShadow = `0 0 10px ${p.style.background}`;
    p.style.setProperty('--dur', (Math.random() * 4 + 4) + 's');
    pLayer.appendChild(p);
  }
</script>
</body>
</html>
