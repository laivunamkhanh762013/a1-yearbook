<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com;">
<title>A1 Cyber Gateway · 2024 - 2028</title>
<link rel="icon" href="Logolop.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Baloo+2:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gateway.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback" async defer></script>
</head>
<body>

<div class="bg-media" aria-hidden="true"></div>
<div class="cyber-grid" aria-hidden="true"></div>
<div class="particles-layer" id="particlesLayer" aria-hidden="true"></div>

<main class="gateway-card" role="main">
  <div class="logo-hologram">
    <img src="Logolop.jpeg" alt="Logo Lớp A1" decoding="async">
  </div>
  <h1 class="gateway-title">A1 Chu Văn An</h1>
  <div class="gateway-sub">🔒 Cyber Gateway · 2024 – 2028</div>

  <div class="pass-display" id="passDisplay" role="status" aria-label="Trạng thái mã PIN">
    <div class="pass-dot" aria-hidden="true"></div>
    <div class="pass-dot" aria-hidden="true"></div>
    <div class="pass-dot" aria-hidden="true"></div>
    <div class="pass-dot" aria-hidden="true"></div>
  </div>

  <div class="keypad-grid" id="keypad" role="group" aria-label="Bàn phím nhập mã PIN">
    <button type="button" class="key-btn" data-val="1" aria-label="Số 1">1</button>
    <button type="button" class="key-btn" data-val="2" aria-label="Số 2">2</button>
    <button type="button" class="key-btn" data-val="3" aria-label="Số 3">3</button>
    <button type="button" class="key-btn" data-val="4" aria-label="Số 4">4</button>
    <button type="button" class="key-btn" data-val="5" aria-label="Số 5">5</button>
    <button type="button" class="key-btn" data-val="6" aria-label="Số 6">6</button>
    <button type="button" class="key-btn" data-val="7" aria-label="Số 7">7</button>
    <button type="button" class="key-btn" data-val="8" aria-label="Số 8">8</button>
    <button type="button" class="key-btn" data-val="9" aria-label="Số 9">9</button>
    <button type="button" class="key-btn action-key" id="clearBtn" aria-label="Xóa tất cả">XÓA</button>
    <button type="button" class="key-btn" data-val="0" aria-label="Số 0">0</button>
    <button type="button" class="key-btn action-key" id="delBtn" aria-label="Xóa 1 số">⌫</button>
  </div>

  <div class="status-text" id="statusText" role="status" aria-live="polite">Vui lòng hoàn thành xác minh và nhập mã PIN</div>

  <div class="cf-box">
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAAg7-j5-e_WvjFqL" data-callback="onTurnstileSuccess"></div>
  </div>
</main>

<script src="gateway.js"></script>
</body>
</html>
